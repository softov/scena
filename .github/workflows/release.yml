name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The GitHub Packages publish. The built-in GITHUB_TOKEN is enough for it —
  # no PAT to create or rotate — as long as the package scope (@softov) matches
  # the repository owner, which GitHub Packages requires.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes the wrong version
      # under the right tag, which cannot be undone once it is on npm.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/scena/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match packages/scena version $PKG"
            exit 1
          fi
          echo "Publishing @softov/scena@$PKG"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # ── npmjs.org ────────────────────────────────────────────────────────
      # First, because this is the one consumers use: GitHub Packages' npm
      # registry demands an authorization header on every read, public packages
      # included, so `pnpm add @softov/scena` only works with nothing configured
      # if the package is here.
      #
      # `setup-node` is re-run rather than configured once, because it writes a
      # single `//<host>/:_authToken` line — one registry per invocation, and
      # these two need different credentials.
      #
      # No `--registry` flag: publishConfig.registry already names npmjs, so a
      # publish run by hand from packages/scena goes to the same place as this.
      # `--access public` is in publishConfig too — scoped packages default to
      # `restricted`, and restricted needs a paid plan, so without it the
      # publish fails rather than quietly going private.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@softov'

      - name: Publish to npm
        run: npm publish
        working-directory: packages/scena
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── GitHub Packages ──────────────────────────────────────────────────
      # `--registry` is explicit here and required: a command-line registry is
      # the one thing that overrides publishConfig.registry, which points at
      # npmjs. Without the flag this step publishes to npm a second time and
      # fails on the duplicate version.
      #
      # No `--provenance` anywhere: that is an npmjs attestation and GitHub
      # Packages rejects it, and the same `npm publish` serves both.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@softov'

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        working-directory: packages/scena
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
