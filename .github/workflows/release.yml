name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Publishing to GitHub Packages. The built-in GITHUB_TOKEN is enough — no PAT
  # secret to create or rotate, as long as the package scope (@softov) matches
  # the repository owner, which GitHub Packages requires.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@softov'

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes the wrong version
      # under the right tag, which cannot be undone once it is on npm.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/scena/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match packages/scena version $PKG"
            exit 1
          fi
          echo "Publishing @softov/scena@$PKG"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # No --provenance: that is an npmjs.org attestation and GitHub Packages
      # does not accept it. Access follows the repository's visibility, so a
      # private repo yields a private package — which is the point here.
      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: packages/scena
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
