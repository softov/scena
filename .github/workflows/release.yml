name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The GitHub Packages publish. The built-in GITHUB_TOKEN is enough for it —
  # no PAT to create or rotate — as long as the package scope (@softov) matches
  # the repository owner, which GitHub Packages requires.
  packages: write
  # The npmjs publish, via trusted publishing. `npm publish` exchanges this
  # short-lived OIDC token for a publish credential, so there is no npm token
  # anywhere — not in a secret, not to rotate, and nothing to leak. npm trusts
  # this repository and this workflow *filename*, which is registered on the
  # package's Trusted Publisher settings: renaming this file breaks publishing
  # until the registration is updated to match.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes the wrong version
      # under the right tag, which cannot be undone once it is on npm.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/scena/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match packages/scena version $PKG"
            exit 1
          fi
          echo "Publishing @softov/scena@$PKG"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # ── npmjs.org ────────────────────────────────────────────────────────
      # First, because this is the one consumers use: GitHub Packages' npm
      # registry demands an authorization header on every read, public packages
      # included, so `pnpm add @softov/scena` only works with nothing configured
      # if the package is here.
      #
      # Trusted publishing (OIDC), not a token. The account requires 2FA for
      # publishing, which is right, and a classic Publish token is challenged
      # for a one-time password it cannot answer from CI — every tagged release
      # died on `EOTP` at this step. An Automation token would have skipped the
      # challenge, but npm is retiring that: 2FA-bypass tokens lose direct
      # publish in early 2027. This is where it was going to end up anyway.
      #
      # No `setup-node` with a registry-url here, deliberately. It writes an
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line, and an empty
      # token is worse than no token: it is an authorization attempt that fails
      # instead of the OIDC exchange that would have worked. publishConfig
      # already names the registry, so nothing has to.
      #
      # `--access public` is in publishConfig too — scoped packages default to
      # `restricted`, and restricted needs a paid plan, so without it the
      # publish fails rather than quietly going private.

      # Node 22 ships npm 10, and OIDC publishing needs 11.5.1+. Safe to take
      # the newest: npm 12's breaking changes are all install-time defaults
      # (lifecycle scripts, git and remote dependencies), and nothing here
      # installs with npm — pnpm does that, three steps up.
      - name: An npm new enough to speak OIDC
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish
        working-directory: packages/scena

      # ── GitHub Packages ──────────────────────────────────────────────────
      # `--registry` is explicit here and required: a command-line registry is
      # the one thing that overrides publishConfig.registry, which points at
      # npmjs. Without the flag this step publishes to npm a second time and
      # fails on the duplicate version.
      #
      # No `--provenance` flag anywhere. npmjs gets provenance for free now —
      # trusted publishing generates it, which is half the reason to want it —
      # and GitHub Packages rejects the attestation, so it must not be asked
      # for on this second, separate `npm publish`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@softov'

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        working-directory: packages/scena
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
